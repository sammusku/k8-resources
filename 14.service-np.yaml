apiVersion:  v1
kind:  Service
metadata:
 name:  nginx-nodeport
spec:
 type:  NodePort
 selector:   #labels are used as selectors
  project:  roboshop
  environment:  dev
  component:  frontend
 ports:
 - protocol:  TCP
   port:  80 #service port
   targetPort:  80 #container port
   nodePort:  32141  # otherwise it wil open from Range: 30000–32767
